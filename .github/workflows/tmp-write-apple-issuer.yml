name: Write Apple API issuer (local runner)
on:
  workflow_dispatch:
jobs:
  write:
    runs-on: [self-hosted, macOS, ARM64, edgeever-mobile]
    steps:
      - name: Write issuer and key id to local config (no log of values)
        env:
          ISSUER: ${{ secrets.EDGEEVER_APPLE_API_ISSUER }}
          KEY_ID: ${{ secrets.EDGEEVER_APPLE_API_KEY_ID }}
          KEY_B64: ${{ secrets.EDGEEVER_APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/edgeever/ios"
          umask 077
          test -n "${ISSUER:-}"
          test -n "${KEY_ID:-}"
          test -n "${KEY_B64:-}"
          printf '%s' "$ISSUER" > "$HOME/.config/edgeever/ios/apple-api-issuer"
          printf '%s' "$KEY_ID" > "$HOME/.config/edgeever/ios/apple-api-key-id"
          printf '%s' "$KEY_B64" | base64 -D > "$HOME/.config/edgeever/ios/AuthKey_${KEY_ID}.p8"
          chmod 600 "$HOME/.config/edgeever/ios/apple-api-issuer" \
            "$HOME/.config/edgeever/ios/apple-api-key-id" \
            "$HOME/.config/edgeever/ios/AuthKey_${KEY_ID}.p8"
          echo "ok issuer_bytes=$(wc -c < "$HOME/.config/edgeever/ios/apple-api-issuer") key_id_bytes=$(wc -c < "$HOME/.config/edgeever/ios/apple-api-key-id")"
