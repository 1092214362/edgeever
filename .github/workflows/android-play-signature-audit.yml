name: Audit Android Play Signature

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Draft Release tag whose Android APK must use the Play app-signing certificate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'tianma-if/edgeever'
    name: Require Play-signed Draft APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the immutable Release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Validate matching Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(jq -r '.draft' <<<"$release")" = "true"
          test "$(jq -r '.prerelease' <<<"$release")" = "false"
          test "$(jq -r '.tag_name' <<<"$release")" = "$RELEASE_TAG"
          release_target="$(jq -r '.target_commitish' <<<"$release")"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse "${release_target}^{commit}")"

      - name: Download the Draft Android APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-release"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'edgeever-android-v*-arm64-v8a.apk' \
            --dir "$RUNNER_TEMP/android-release"
          test "$(find "$RUNNER_TEMP/android-release" -type f -name 'edgeever-android-v*-arm64-v8a.apk' | wc -l | tr -d ' ')" = "1"
          apk_path="$(find "$RUNNER_TEMP/android-release" -type f -name 'edgeever-android-v*-arm64-v8a.apk' -print -quit)"
          echo "apk_path=$apk_path" >> "$GITHUB_ENV"

      - name: Require the Play app-signing certificate
        env:
          ANDROID_PLAY_APP_SIGNER_SHA256: ${{ secrets.ANDROID_PLAY_APP_SIGNER_SHA256 }}
          EDGE_EVER_ANDROID_ALLOWED_SIGNER_SHA256: ${{ secrets.ANDROID_PLAY_APP_SIGNER_SHA256 }}
        run: |
          test -n "$ANDROID_PLAY_APP_SIGNER_SHA256"
          node scripts/verify-android-apk-signature.mjs "$apk_path"
